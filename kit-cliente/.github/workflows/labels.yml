name: Sincronizar etiquetas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/labels.json']
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear/actualizar etiquetas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r l; do
            gh label create "$(jq -r .name <<<"$l")" --color "$(jq -r .color <<<"$l")" \
              --description "$(jq -r .description <<<"$l")" --force --repo "$GITHUB_REPOSITORY"
          done
