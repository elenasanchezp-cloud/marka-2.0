name: Entrega (release)
# Cada entrega a un cliente = una etiqueta vX.Y.Z. Al subirla se crea la release con notas automáticas.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
