<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>¿La reconoces sin su logo?</title>
<link rel="stylesheet" href="../motor/base.css">
<style>
.pal{position:absolute;left:0;right:0;text-align:center}
.k{position:absolute;color:var(--hueso)}
#tablero{position:absolute;left:110px;top:560px;width:860px;height:860px;overflow:hidden;border-radius:6px}
#tablero > div{position:absolute}
#barra{position:absolute;left:110px;top:1460px;height:10px;background:var(--hueso);width:0}
#marco{position:absolute;left:110px;top:1460px;height:10px;width:860px;background:var(--hueso);opacity:.15}
#nombre{position:absolute;left:0;right:0;top:1520px;text-align:center}
</style></head>
<body><div class="lienzo">

<section class="esc" id="s1">
  <div class="k" id="s1k" style="left:430px;top:300px;width:220px;height:221px"></div>
  <div class="pal et" style="top:640px;color:var(--piedra)">Prueba de marka</div>
  <div class="pal d" id="s1a" style="top:740px;font-size:150px">SOLO CON</div>
  <div class="pal d" id="s1b" style="top:875px;font-size:150px">SUS COLORES.</div>
  <div class="pal d" id="s1c" style="top:1080px;font-size:118px;color:var(--piedra)">¿CUÁNTAS</div>
  <div class="pal d" id="s1d" style="top:1185px;font-size:118px;color:var(--piedra)">ACIERTAS?</div>
</section>

<section class="esc" id="s2">
  <div class="pal et" id="ronda" style="top:300px;color:var(--piedra)"></div>
  <div class="pal d" style="top:380px;font-size:104px">¿QUÉ MARKA ES?</div>
  <div id="tablero"></div>
  <div id="marco"></div><div id="barra"></div>
  <div id="nombre" class="d" style="font-size:118px"></div>
</section>

<section class="esc" id="s3" style="background:var(--hueso);color:var(--carbon)">
  <div class="pal d" id="s3a" style="top:470px;font-size:124px">SI TAPAS<br>TU LOGO,<br>¿TE RECONOCEN?</div>
  <div class="pal b" id="s3b" style="top:900px;font-size:54px;padding:0 120px">Un logo es la firma. Lo que te hace reconocible es todo lo demás.</div>
  <div class="pal d" id="s3c" style="top:1200px;font-size:96px">COMENTA «MARKA»</div>
  <div class="pal b" id="s3d" style="top:1310px;font-size:50px;padding:0 140px">y te decimos si tu marka pasa la prueba.</div>
</section>

<section class="esc" id="s4">
  <div class="k" id="s4k" style="left:390px;top:620px;width:300px;height:302px"></div>
  <div class="pal d" id="s4a" style="top:1010px;font-size:110px;letter-spacing:.12em">MARKA</div>
  <div class="pal et" id="s4b" style="top:1150px;color:var(--piedra)">Esto no es un logo. Es una marka.</div>
</section>

<div id="flash" class="esc" style="background:var(--hueso);opacity:0;z-index:50"></div>
<div id="grano"></div>
</div>
<script src="../motor/k-path.js"></script>
<script src="../motor/motor.js"></script>
<script>
const {e, p, lerp, spring, vis, $, set, clamp} = M;
['#s1k','#s4k'].forEach(s => $(s).innerHTML = M.kSvg());
// Rondas: solo color y forma abstracta, sin logotipos.
const R = [
  {n:'COCA-COLA', bg:'#E41E2B', f:[{c:'#FFFFFF', s:'left:-10%;top:42%;width:120%;height:14%;border-radius:50%;transform:rotate(-8deg)'}]},
  {n:'IKEA', bg:'#0058A3', f:[{c:'#FFDA1A', s:'left:12%;top:33%;width:76%;height:34%;border-radius:50%'}]},
  {n:'SPOTIFY', bg:'#191414', f:[{c:'#1DB954', s:'left:25%;top:25%;width:50%;height:50%;border-radius:50%'}]},
  {n:'MCDONALD’S', bg:'#DA291C', f:[{c:'#FFC72C', s:'left:0;top:62%;width:100%;height:38%'}]},
  {n:'MILKA', bg:'#7B5AA6', f:[{c:'#FFFFFF', s:'left:0;top:0;width:100%;height:22%'}]},
  {n:'TIFFANY & CO.', bg:'#81D8D0', f:[{c:'#FFFFFF', s:'left:44%;top:0;width:12%;height:100%'},{c:'#FFFFFF', s:'left:0;top:44%;width:100%;height:12%'}]},
];
const T0 = 2.3, RD = [2.6, 2.5, 2.4, 2.3, 2.2, 2.4]; // cada ronda un poco más rápida
const ini = []; let acc = T0; RD.forEach(d => { ini.push(acc); acc += d; });
const T3 = acc, T4 = T3 + 4.2; window.DURACION = T4 + 2.6;
let cur = -1;
function pinta(i) {
  if (cur === i) return; cur = i;
  const r = R[i]; const tb = $('#tablero');
  tb.style.background = r.bg;
  tb.innerHTML = r.f.map(f => `<div style="background:${f.c};${f.s}"></div>`).join('');
  $('#ronda').textContent = `Ronda ${i + 1} de ${R.length}`;
  $('#nombre').textContent = r.n;
}
function stamp(el, t, a, from = 1.6) { const k = e(t, a, a + .3); set(el, {opacity: t < a ? 0 : 1, transform: `scale(${lerp(from, 1, k)})`}); }
function up(el, t, a, d = .5, dy = 60) { const k = e(t, a, a + d); set(el, {opacity: k, transform: `translateY(${(1 - k) * dy}px)`}); }

window.render = function (t) {
  M.grano(t);
  vis($('#s1'), t < T0); vis($('#s2'), t >= T0 && t < T3); vis($('#s3'), t >= T3 && t < T4); vis($('#s4'), t >= T4);
  let fl = 0; [T0, T3, T4].concat(ini.slice(1)).forEach(c => { const d = t - c; if (d >= 0 && d < .15) fl = Math.max(fl, 1 - d / .15); });
  $('#flash').style.opacity = fl * .8;
  if (t < T0) {
    // el gancho ya se lee en el primer fotograma
    $('#s1k').style.transform = `rotate(${Math.sin(t * 3) * 8}deg) scale(${1 + Math.sin(t * 6) * .03})`;
    stamp($('#s1a'), t, 0, 1.08); stamp($('#s1b'), t, 0, 1.08);
    up($('#s1c'), t, .55, .35, 30); up($('#s1d'), t, .75, .35, 30);
    const o = e(t, T0 - .25, T0); $('#s1').style.transform = `scale(${1 - o * .1})`;
  }
  if (t >= T0 && t < T3) {
    let i = ini.length - 1; while (ini[i] > t) i--;
    pinta(i);
    const a = ini[i], d = RD[i], rev = a + d * .62;
    const k = e(t, a, a + .35);
    const tb = $('#tablero');
    set(tb, {transform: `scale(${lerp(.82, 1, k)}) rotate(${lerp(-4, 0, k)}deg)`, opacity: k});
    [...tb.children].forEach((c, n) => { const kk = spring(t, a + .12 + n * .08, .8, 1.4, 5); c.style.transform = (c.style.transform.replace(/scale\([^)]*\)/, '') + ` scale(${kk})`).trim(); });
    $('#barra').style.width = `${(1 - clamp((t - a - .2) / (rev - a - .2))) * 860}px`;
    const nm = $('#nombre');
    if (t < rev) nm.style.opacity = 0; else stamp(nm, t, rev, 1.5);
  }
  if (t >= T3 && t < T4) {
    up($('#s3a'), t, T3 + .05, .5, 60); up($('#s3b'), t, T3 + .9, .5, 30);
    stamp($('#s3c'), t, T3 + 1.9, 1.4); up($('#s3d'), t, T3 + 2.3, .45, 25);
  }
  if (t >= T4) {
    const k = spring(t, T4, 1.1, 1.8, 5);
    set($('#s4k'), {transform: `scale(${lerp(2.4, 1, k)}) rotate(${lerp(-20, 0, k)}deg)`});
    up($('#s4a'), t, T4 + .45, .5, 40); up($('#s4b'), t, T4 + .8, .5, 20);
  }
};
window.render(0);
</script>
</body></html>
