<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#D9D5CC}</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#D9D5CC"/><g id="p"></g></svg>
<script src="../motor/personajes.js"></script>
<script>
const sm=x=>x<0?0:x>1?1:x*x*(3-2*x);
const back=x=>{x=Math.min(1,Math.max(0,x));const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const habla=(t,a,b)=>t>a&&t<b?Math.max(0,Math.sin(t*23)*.5+Math.sin(t*37)*.35+.35):0;
const parp=(t,o)=>{const k=(t+o)%3.1;return k<.14?Math.sin(k/.14*Math.PI):0};
function pose(n,t){
  const E=n==='elena';
  if(E){
    const w=back((t-.5)/.5), ola=t>.9&&t<2.2?Math.sin((t-.9)*12)*22:0;
    const b=Math.sin(t*2.4)*.012;
    const cab=Math.sin(t*1.7)*4+(t>2.4?-10*sm((t-2.4)/.4):0);
    return {x:330,y:1880,s:.95,aplasta:b+(t>.4&&t<.6?-.04*Math.sin((t-.4)/.2*Math.PI):0),cabeza:cab,pelo:-cab*2.2,giro:Math.sin(t*1.3)*1.5,
      brazoD:[10+w*120+ola*.3,-8+w*40+ola],manoD:w>.5?'abierta':'puno',parpadeo:parp(t,.3),mira:t>2.4?[.9,.2]:[.2,-.1],
      boca:{abre:habla(t,.9,2.2),sonrisa:.6},cejas:[.4+(t>.9&&t<1.2?.6:0),.4+(t>.9&&t<1.2?.6:0)],rubor:.3};
  }
  const j=t>2.4&&t<3.4?Math.abs(Math.sin((t-2.4)*Math.PI*2))*60:0;
  const sq=t>2.4&&t<3.4?Math.cos((t-2.4)*Math.PI*4)*.05:Math.sin(t*2.1)*.01;
  const cab=Math.sin(t*1.9+1)*5;
  return {x:780,y:1880-j,s:.95,aplasta:sq,cabeza:cab,pelo:-cab*2.5+(j?Math.sin(t*12)*8:0),
    brazoI:t>2.4?[40+j*1.5,30]:[10,-6],brazoD:t>2.4?[40+j*1.5,30]:[25,95],manoI:t>2.4?'abierta':'puno',manoD:t>2.4?'abierta':'dedo',
    parpadeo:parp(t,1.4),mira:t<2.4?[-.8,-.4]:[-.3,-.6],boca:{abre:habla(t,2.4,3.6),sonrisa:.7,o:t>2.5&&t<2.8?.8:0},
    cejas:t>2.4?[1,1]:[0,0],rubor:t>2.4?1:.2};
}
window.render=t=>{document.getElementById('p').innerHTML=Personajes.svg('elena',pose('elena',t))+Personajes.svg('aitana',pose('aitana',t))};
window.DURACION=4;
</script></body></html>
